[package]
name = "sshx-server"
version.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
edition = "2021"

# Metadata used by `cargo-deb` to build Debian packages for the server
# binary; see `scripts/package.sh` and issue #35.
[package.metadata.deb]
maintainer = "Eric Zhang <ekzhang1@gmail.com>"
depends = "$auto"
section = "utils"
extended-description-file = "packaging/description.txt"
assets = [
  "$auto", # binary at usr/bin/sshx-server
  ["packaging/man/sshx-server.1.gz", "usr/share/man/man1/", "644"],
]

# Metadata used by `cargo-generate-rpm` to build RPM packages for the
# server binary. The "target/release" prefix is resolved by cargo-generate-rpm
# to the actual build products for the selected target.
[package.metadata.generate-rpm]
maintainer = "Eric Zhang <ekzhang1@gmail.com>"
url = "https://sshx.io"
summary = "Server daemon for sshx, a secure web-based collaborative terminal"
assets = [
  { source = "target/release/sshx-server", dest = "/usr/bin/sshx-server", mode = "755" },
  { source = "packaging/man/sshx-server.1.gz", dest = "/usr/share/man/man1/sshx-server.1.gz", mode = "644" },
]

[dependencies]
anyhow.workspace = true
async-channel = "1.9.0"
async-stream = "0.3.5"
axum = { version = "0.8.1", features = ["http2", "ws"] }
base64 = "0.21.4"
bytes = { version = "1.5.0", features = ["serde"] }
ciborium = "0.2.1"
clap.workspace = true
dashmap = "5.5.3"
deadpool = "0.12.2"
deadpool-redis = "0.18.0"
futures-util = { version = "0.3.28", features = ["sink"] }
hmac = "0.12.1"
http = "1.2.0"
parking_lot = "0.12.1"
prost.workspace = true
rand.workspace = true
redis = { version = "0.27.6", features = ["tokio-rustls-comp", "tls-rustls-webpki-roots"] }
serde.workspace = true
sha2 = "0.10.7"
sshx-core.workspace = true
subtle = "2.5.0"
tokio.workspace = true
tokio-stream.workspace = true
tokio-tungstenite = "0.26.1"
tonic.workspace = true
tonic-reflection.workspace = true
tower = { version = "0.4.13", features = ["steer"] }
tower-http = { version = "0.6.2", features = ["fs", "redirect", "trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zstd = "0.12.4"

[dev-dependencies]
reqwest = { version = "0.12.12", default-features = false, features = ["rustls-tls"] }
sshx = { path = "../sshx" }
