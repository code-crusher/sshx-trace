[package]
name = "sshx"
version.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
edition = "2021"

# Metadata used by `cargo-deb` to build Debian packages for the client
# binary; see `scripts/package.sh` and issue #35.
[package.metadata.deb]
maintainer = "Eric Zhang <ekzhang1@gmail.com>"
depends = "$auto"
section = "utils"
extended-description-file = "packaging/description.txt"
assets = [
  "$auto", # binary at usr/bin/sshx
  ["packaging/man/sshx.1.gz", "usr/share/man/man1/", "644"],
]

# Metadata used by `cargo-generate-rpm` to build RPM packages for the
# client binary. The "target/release" prefix is resolved by cargo-generate-rpm
# to the actual build products for the selected target.
[package.metadata.generate-rpm]
maintainer = "Eric Zhang <ekzhang1@gmail.com>"
url = "https://sshx.io"
summary = "A secure web-based, collaborative terminal"
assets = [
  { source = "target/release/sshx", dest = "/usr/bin/sshx", mode = "755" },
  { source = "packaging/man/sshx.1.gz", dest = "/usr/share/man/man1/sshx.1.gz", mode = "644" },
]

[dependencies]
aes = "0.8.3"
ansi_term = "0.12.1"
anyhow.workspace = true
argon2 = { version = "0.5.2", default-features = false, features = ["alloc"] }
cfg-if = "1.0.0"
clap.workspace = true
ctr = "0.9.2"
encoding_rs = "0.8.31"
pin-project = "1.1.3"
sshx-core.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
whoami = { version = "1.5.1", default-features = false }

[target.'cfg(unix)'.dependencies]
close_fds = "0.3.2"
nix = { version = "0.27.1", features = ["ioctl", "process", "signal", "term"] }

[target.'cfg(windows)'.dependencies]
conpty = "0.7.0"
